[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bestbefore"
version = "0.1.0"
description = "Read expiry dates on product packaging, and predict whether a photo's date will be readable."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]   # matplotlib: scripts/readme_figures.py
# Only for fetching ExpDate (scripts/download_expdate.py).
download = ["gdown"]
# Detector training and inference (M1). Pinned so the laptop and the
# cluster run the same code.
train = ["ultralytics==8.4.177"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
