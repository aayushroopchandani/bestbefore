[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bestbefore"
version = "0.1.0"
description = "Read expiry dates on product packaging, and predict whether a photo's date will be readable."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]   # matplotlib: scripts/readme_figures.py
# Baseline A (M0, C1): the same RapidOCR as Scanify, so A and B differ only
# in what Scanify adds.
baselines = ["rapidocr-onnxruntime==1.2.3"]
# Only for fetching ExpDate (scripts/download_expdate.py).
download = ["gdown"]
# Detector training and inference (M1). Pinned so the laptop and the
# cluster run the same code. torch 2.11 is the newest build for CUDA 12.8,
# the newest CUDA the cluster's GPU driver (570) supports; on the cluster,
# install torch and torchvision from the cu128 index first (docs/m1-date-detector.md, A1).
train = ["ultralytics==8.4.177", "torch==2.11.0", "torchvision==0.26.0"]
# The M2 generator (src/bestbefore/synth): fonttools reads the fonts' tables
# (axes, characters, licences). OpenCV comes with the train extra
# (Ultralytics), so generation runs in the training environment.
synth = ["fonttools"]
# M3's readers (docs/m3-date-reader.md): crops in LMDB files, CTC readers
# exported and scored as ONNX.
read = ["lmdb==3.0.0", "onnx==1.23.2", "onnxruntime==1.31.1"]
# M3's VLM, Qwen3-VL-2B with LoRA. The newest releases on 2026-11-12, pinned
# as the cluster installed them, with every package the train extra brought
# held at its version (M3 S1).
vlm = ["transformers==5.22.2", "peft==0.21.2", "accelerate==1.15.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
